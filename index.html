<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منصة المحاسبة المالية</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }
    header {
      background: #174ea6;
      color: white;
      padding: 17px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    header h2 { font-size: 19px; margin: 0; }
    main { max-width: 950px; margin: 25px auto; padding: 15px; }
    .card {
      background: white;
      padding: 22px;
      border-radius: 13px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.05);
      margin-bottom: 18px;
    }
    .auth { max-width: 430px; margin: 45px auto; }
    h1 { font-size: 24px; margin-top: 0; }
    h2, h3 { margin-top: 0; }
    label { display: block; font-weight: bold; margin: 14px 0 7px; }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      background: #174ea6;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 12px;
    }
    button.secondary { background: #e2e8f0; color: #172033; }
    button.danger { background: #dc2626; }
    button.success { background: #15803d; }
    button.logout { background: white; color: #174ea6; margin: 0; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hidden { display: none !important; }
    .muted { color: #64748b; }
    .item {
      border: 1px solid #e2e8f0;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }
    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      background: #e2e8f0;
      font-size: 13px;
    }
    .status.published { background: #dcfce7; color: #166534; }
    .status.draft { background: #fef3c7; color: #92400e; }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions button { margin-top: 8px; }
    .prototype-note {
      background: #fff7ed;
      color: #9a3412;
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.6;
    }
    @media (max-width: 600px) {
      main { padding: 9px; }
      .card { padding: 15px; }
    }
  </style>
</head>
<body>
  <header>
    <h2>منصة المحاسبة المالية</h2>
    <button id="logout" class="logout hidden">تسجيل الخروج</button>
  </header>

  <main>
    <section id="authSection" class="card auth">
      <h1>أهلاً بك</h1>
      <p class="muted">منصة التدريب وحل التكليفات</p>

      <form id="authForm">
        <label>رقم الهاتف أو اسم المستخدم</label>
        <input id="username" type="text" autocomplete="username" required>

        <label>كلمة المرور</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <div id="nameArea" class="hidden">
          <label>اسم الطالب</label>
          <input id="displayName" type="text" autocomplete="name">
        </div>

        <button id="submitButton" type="submit">تسجيل الدخول</button>
        <button id="switchButton" type="button" class="secondary">إنشاء حساب جديد</button>
      </form>
      <p id="message"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="card">
        <h1 id="welcome">مرحبًا</h1>
        <p id="accountType" class="muted"></p>
      </div>

      <section id="adminArea" class="hidden">
        <div class="card">
          <h2 id="formTitle">إضافة تكليف جديد</h2>
          <form id="assignmentForm">
            <input type="hidden" id="editId">
            <label>رقم التكليف</label>
            <input id="assignmentNumber" type="number" min="1" placeholder="مثال: 1" required>
            <label>عنوان التكليف</label>
            <input id="assignmentTitle" type="text" placeholder="مثال: قيود اليومية" required>
            <label>وصف التكليف</label>
            <textarea id="assignmentDescription" placeholder="اكتب وصف التكليف هنا..."></textarea>
            <label>حالة التكليف</label>
            <select id="assignmentStatus">
              <option value="draft">مسودة - غير ظاهر للطلاب</option>
              <option value="published">منشور - ظاهر للطلاب</option>
            </select>
            <div class="actions">
              <button id="saveButton" type="submit">حفظ التكليف</button>
              <button id="cancelButton" type="button" class="secondary hidden">إلغاء التعديل</button>
            </div>
          </form>
          <p id="adminMessage"></p>
        </div>

        <div class="card">
          <div class="section-title">
            <h2>إدارة التكليفات</h2>
            <button id="refreshButton" class="secondary" type="button">تحديث القائمة</button>
          </div>
          <div id="assignmentsList">
            <p class="muted">جارٍ تحميل التكليفات...</p>
          </div>
        </div>
      </section>

      <section id="studentArea" class="hidden">
        <div class="card">
          <h2>التكليفات المتاحة</h2>
          <div id="studentAssignments">
            <p class="muted">جارٍ تحميل التكليفات...</p>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://owiwfhgixuzkxsahucay.supabase.co";
    const SUPABASE_KEY = "sb_publishable_y1g-kmOt8BqUHuNzbTKChg_ZCrYG6K0";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = (id) => document.getElementById(id);

    const DEMO_USERS = {
      "00000000000": { password: "123456", name: "طالب تجريبي", role: "student" },
      "admin": { password: "admin123", name: "مدير النظام", role: "admin" }
    };

    let currentUser = null;

    function normalizeLoginValue(value) {
      return String(value || '').trim().replace(/\s+/g, '').replace(/[٠-٩]/g, d => String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
    }

    function message(id, text, color = "#172033") {
      const el = $(id);
      if (!el) return;
      el.textContent = text;
      el.style.color = color;
    }

    function showLogin() {
      currentUser = null;
      $("authSection").classList.remove("hidden");
      $("dashboard").classList.add("hidden");
      $("adminArea").classList.add("hidden");
      $("studentArea").classList.add("hidden");
      $("logout").classList.add("hidden");
      $("authForm").reset();
      $("nameArea").classList.add("hidden");
      $("submitButton").textContent = "تسجيل الدخول";
      $("switchButton").textContent = "إنشاء حساب جديد";
      message("message", "");
    }

    function showDashboard(user) {
      $("authSection").classList.add("hidden");
      $("dashboard").classList.remove("hidden");
      $("logout").classList.remove("hidden");
      $("welcome").textContent = `مرحبًا ${user.name}`;
      $("accountType").textContent = user.role === "admin" ? "مدير النظام" : "طالب";

      if (user.role === "admin") {
        $("adminArea").classList.remove("hidden");
        $("studentArea").classList.add("hidden");
      } else {
        $("adminArea").classList.add("hidden");
        $("studentArea").classList.remove("hidden");
      }

      loadAssignments();
    }

    function resetAssignmentForm() {
      $("assignmentForm").reset();
      $("editId").value = "";
      $("formTitle").textContent = "إضافة تكليف جديد";
      $("saveButton").textContent = "حفظ التكليف";
      $("cancelButton").classList.add("hidden");
      message("adminMessage", "");
    }

    function addText(parent, tag, text, className = "") {
      const el = document.createElement(tag);
      el.textContent = text ?? "";
      if (className) el.className = className;
      parent.appendChild(el);
      return el;
    }

    function addDemoAssignments() {
      return [
        { id: 1, assignment_number: 1, title: "قيود اليومية", description: "تمرين إدخال قيود محاسبية", status: "published" },
        { id: 2, assignment_number: 2, title: "ميزان المراجعة", description: "تجميع وتصنيف الحسابات", status: "published" }
      ];
    }

    async function loadAssignments() {
      const list = $("assignmentsList");
      const studentList = $("studentAssignments");
      const isAdmin = currentUser && currentUser.role === "admin";

      if (!list || !studentList) return;

      list.innerHTML = '<p class="muted">جارٍ تحميل التكليفات...</p>';
      studentList.innerHTML = '<p class="muted">جارٍ تحميل التكليفات...</p>';

      try {
        const { data, error } = await db
          .from("assignments")
          .select("id,title,description,assignment_number,status")
          .order("assignment_number", { ascending: true });

        const assignments = error || !data ? addDemoAssignments() : data;

        if (isAdmin) {
          list.replaceChildren();
          if (!assignments.length) {
            addText(list, "p", "لا توجد تكليفات حتى الآن.", "muted");
            return;
          }

          assignments.forEach((item) => {
            const card = addText(list, "div", "", "item");
            addText(card, "h3", `التكليف ${item.assignment_number}: ${item.title}`);
            addText(card, "p", item.description || "لا يوجد وصف");
            addText(card, "span", item.status === "published" ? "منشور" : "مسودة", "status " + item.status);

            const actions = addText(card, "div", "", "actions");
            const edit = addText(actions, "button", "تعديل");
            edit.addEventListener("click", () => editAssignment(item));

            const remove = addText(actions, "button", "حذف", "danger");
            remove.addEventListener("click", () => deleteAssignment(item));
          });
        }

        studentList.replaceChildren();
        const visible = assignments.filter((item) => item.status === "published");
        if (!visible.length) {
          addText(studentList, "p", "لا توجد تكليفات منشورة حاليًا.", "muted");
          return;
        }

        visible.forEach((item) => {
          const card = addText(studentList, "div", "", "item");
          addText(card, "h3", `التكليف ${item.assignment_number}: ${item.title}`);
          addText(card, "p", item.description || "لا يوجد وصف");
          addText(card, "span", "منشور", "status published");

          const action = addText(card, "button", "فتح التكليف");
          action.addEventListener("click", () => {
            alert(`تم فتح التكليف: ${item.title}`);
          });
        });
      } catch (error) {
        const fallback = addDemoAssignments();
        list.replaceChildren();
        studentList.replaceChildren();
        fallback.forEach((item) => {
          const card = addText(list, "div", "", "item");
          addText(card, "h3", `التكليف ${item.assignment_number}: ${item.title}`);
          addText(card, "p", item.description || "لا يوجد وصف");
          addText(card, "span", item.status === "published" ? "منشور" : "مسودة", "status " + item.status);
        });
      }
    }

    function editAssignment(item) {
      $("editId").value = item.id;
      $("assignmentNumber").value = item.assignment_number ?? "";
      $("assignmentTitle").value = item.title;
      $("assignmentDescription").value = item.description || "";
      $("assignmentStatus").value = item.status;
      $("formTitle").textContent = "تعديل التكليف";
      $("saveButton").textContent = "حفظ التعديلات";
      $("cancelButton").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteAssignment(item) {
      if (!confirm(`هل أنت متأكد من حذف التكليف "${item.title}"؟`)) return;

      try {
        const { error } = await db.from("assignments").delete().eq("id", item.id);
        if (error) throw error;
        resetAssignmentForm();
        await loadAssignments();
      } catch (err) {
        alert("تعذر الحذف: " + err.message);
      }
    }

    $("assignmentForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const item = {
        assignment_number: Number($("assignmentNumber").value),
        title: $("assignmentTitle").value.trim(),
        description: $("assignmentDescription").value.trim(),
        status: $("assignmentStatus").value
      };

      if (!item.assignment_number || !item.title) {
        message("adminMessage", "يرجى تعبئة رقم التكليف وعنوانه.", "#dc2626");
        return;
      }

      try {
        const editId = $("editId").value;
        const query = editId
          ? db.from("assignments").update(item).eq("id", editId)
          : db.from("assignments").insert(item);

        const { error } = await query;
        if (error) throw error;

        resetAssignmentForm();
        await loadAssignments();
        message("adminMessage", editId ? "تم تحديث التكليف بنجاح." : "تم حفظ التكليف بنجاح.", "#15803d");
      } catch (err) {
        message("adminMessage", "فشل حفظ التكليف: " + err.message, "#dc2626");
      }
    });

    $("cancelButton").addEventListener("click", resetAssignmentForm);
    $("refreshButton").addEventListener("click", loadAssignments);

    $("switchButton").addEventListener("click", () => {
      const nameArea = $("nameArea");
      const hidden = nameArea.classList.contains("hidden");
      nameArea.classList.toggle("hidden", !hidden);
      $("submitButton").textContent = hidden ? "إنشاء الحساب" : "تسجيل الدخول";
      $("switchButton").textContent = hidden ? "لدي حساب بالفعل" : "إنشاء حساب جديد";
      message("message", "");
    });

    $("logout").addEventListener("click", () => {
      currentUser = null;
      showLogin();
    });

    async function handleLogin(registerMode) {
      const loginInput = $("username").value;
      const password = $("password").value.trim();
      const name = $("displayName").value.trim();
      const loginValue = normalizeLoginValue(loginInput);

      if (!loginValue || !password) {
        message("message", "يرجى إدخال اسم المستخدم أو رقم الهاتف وكلمة المرور.", "#dc2626");
        return;
      }

      const demoUser = DEMO_USERS[loginValue] || DEMO_USERS[String(loginValue).toLowerCase()];
      if (demoUser && demoUser.password === password) {
        currentUser = { ...demoUser, phone: loginValue };
        showDashboard(currentUser);
        return;
      }

      if (loginValue === "admin" && password === "admin123") {
        currentUser = { phone: "admin", name: "مدير النظام", role: "admin" };
        showDashboard(currentUser);
        return;
      }

      if (registerMode) {
        if (!name) {
          message("message", "يرجى إدخال اسم الطالب عند إنشاء حساب جديد.", "#dc2626");
          return;
        }

        try {
          const payload = {
            phone: loginValue,
            username: loginValue,
            name,
            password,
            role: "student"
          };

          const { error } = await db.from("profiles").insert(payload);
          if (error && error.code !== "23505") throw error;

          currentUser = { phone: loginValue, name, role: "student" };
          showDashboard(currentUser);
          message("message", "تم إنشاء الحساب بنجاح.", "#15803d");
          return;
        } catch (err) {
          currentUser = { phone: loginValue, name, role: "student" };
          showDashboard(currentUser);
          return;
        }
      }

      try {
        const { data, error } = await db
          .from("profiles")
          .select("*")
          .or(`phone.eq.${loginValue},username.eq.${loginValue}`)
          .limit(1);

        const profile = !error && data && data.length ? data[0] : null;

        if (profile && profile.password === password) {
          currentUser = {
            phone: profile.phone || loginValue,
            name: profile.name || profile.username || "مستخدم",
            role: profile.role || "student"
          };
          showDashboard(currentUser);
          return;
        }

        message("message", "اسم المستخدم أو كلمة المرور غير صحيحة.", "#dc2626");
      } catch (err) {
        message("message", "حدث خطأ أثناء تسجيل الدخول: " + err.message, "#dc2626");
      }
    }

    $("authForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const registerMode = !$("nameArea").classList.contains("hidden");
      await handleLogin(registerMode);
    });

    showLogin();
  </script>
</body>
</html>
