<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة المحاسبة المالية</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #172033;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 30px #00000012;
    }
    h1 { text-align: center; font-size: 25px; margin: 0 0 8px; }
    .subtitle { text-align: center; color: #64748b; margin-bottom: 25px; }
    label { display: block; margin: 14px 0 7px; font-weight: bold; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 16px;
      border: 0;
      border-radius: 9px;
      background: #174ea6;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button.secondary { background: #e2e8f0; color: #172033; }
    button:disabled { opacity: .6; }
    #message { text-align: center; margin-top: 16px; line-height: 1.6; }
    .note { color: #64748b; font-size: 13px; text-align: center; margin-top: 18px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>منصة المحاسبة المالية</h1>
    <p class="subtitle">منصة التدريب وحل التكليفات</p>

    <form id="authForm">
      <label for="username">اسم المستخدم (11 رقمًا)</label>
      <input id="username" type="text" inputmode="numeric"
        maxlength="11" placeholder="مثال: 12345678901" required>

      <label for="password">كلمة المرور</label>
      <input id="password" type="password"
        placeholder="أدخل كلمة المرور" required>

      <div id="signupName" hidden>
        <label for="displayName">اسم الطالب</label>
        <input id="displayName" type="text" placeholder="اسمك">
      </div>

      <button type="submit" id="loginButton">تسجيل الدخول</button>
      <button type="button" class="secondary" id="signupButton">إنشاء حساب جديد</button>
    </form>

    <p id="message" role="status"></p>
    <p class="note">اسم المستخدم يتكون من 11 رقمًا، ولا يشترط أن يكون رقم هاتف حقيقيًا.</p>
  </main>

  <script>
    const SUPABASE_URL = "https://owiwfhgixuzkxsahucay.supabase.co";
    const SUPABASE_KEY = "sb_publishable_y1g-kmOt8BqUHuNzbTKChg_ZCrYG6K0";

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("authForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const displayNameInput = document.getElementById("displayName");
    const signupName = document.getElementById("signupName");
    const loginButton = document.getElementById("loginButton");
    const signupButton = document.getElementById("signupButton");
    const message = document.getElementById("message");

    let mode = "login";

    function showMessage(text, color = "#172033") {
      message.textContent = text;
      message.style.color = color;
    }

    signupButton.addEventListener("click", () => {
      mode = mode === "login" ? "signup" : "login";
      signupName.hidden = mode !== "signup";
      loginButton.textContent = mode === "signup" ? "إنشاء الحساب" : "تسجيل الدخول";
      signupButton.textContent = mode === "signup" ? "العودة لتسجيل الدخول" : "إنشاء حساب جديد";
      showMessage("");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!/^[0-9]{11}$/.test(username)) {
        showMessage("اسم المستخدم يجب أن يتكون من 11 رقمًا بالضبط.", "#dc2626");
        return;
      }

      if (password.length < 8) {
        showMessage("كلمة المرور يجب ألا تقل عن 8 أحرف أو أرقام.", "#dc2626");
        return;
      }

      if (mode === "signup" && !displayNameInput.value.trim()) {
        showMessage("اكتب اسم الطالب.", "#dc2626");
        return;
      }

      loginButton.disabled = true;
      signupButton.disabled = true;
      showMessage("جارٍ تنفيذ الطلب...");

      const email = `${username}@accounts.financial-accounting.example`;
      let result;

      try {
        if (mode === "signup") {
          result = await client.auth.signUp({
            email,
            password,
            options: {
              data: {
                username,
                display_name: displayNameInput.value.trim()
              }
            }
          });
        } else {
          result = await client.auth.signInWithPassword({ email, password });
        }

        if (result.error) throw result.error;

        if (mode === "signup") {
          showMessage("تم إنشاء الحساب بنجاح. يمكنك الآن تسجيل الدخول.", "#15803d");
          mode = "login";
          signupName.hidden = true;
          loginButton.textContent = "تسجيل الدخول";
          signupButton.textContent = "إنشاء حساب جديد";
          passwordInput.value = "";
        } else {
          showMessage("تم تسجيل الدخول بنجاح.", "#15803d");
        }
      } catch (error) {
        showMessage("حدث خطأ: " + error.message, "#dc2626");
      } finally {
        loginButton.disabled = false;
        signupButton.disabled = false;
      }
    });
  </script>
</body>
      </html>
